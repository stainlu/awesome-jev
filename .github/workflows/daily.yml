name: Daily sweep

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The built-in GITHUB_TOKEN cannot call the code search endpoint, and the
      # code signals are what find established projects that added Jev support
      # without renaming themselves. Without a PAT the sweep would quietly lose
      # them, so stop here instead.
      - name: Require a token that can search code
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::GH_PAT is not set. Create a token with public_repo scope at" \
                 "https://github.com/settings/tokens and add it as the GH_PAT repository secret."
            exit 1
          fi

      - name: Discover projects
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/discover.py

      - name: Rebuild README
        run: python3 scripts/build_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json README.md
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Daily sweep: $(date -u +%Y-%m-%d)"
          git push
